name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run strict typecheck
        run: bun --bun run typecheck

      - name: Run focused tests
        run: bun --bun run test

      - name: Run frontend build checks
        run: bun --bun run build

      - name: Build container image
        run: docker build -t myaitech/studio:0.1.0-rc.3 .

      - name: Enforce changelog update on PRs
        if: github.event_name == 'pull_request'
        run: node scripts/check-changelog-ci.mjs
